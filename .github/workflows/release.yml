name: Build Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Build release APK
        run: ./gradlew app:assembleRelease
        working-directory: android

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=Hisab v${VERSION} · build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Stage APK for release
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          RUN="${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk "hisab-${VERSION}-build${RUN}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "Hisab.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisab-release-apk
          path: '*.apk'
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            Automated release build.

            - Commit: `${{ github.sha }}`
            - Trigger: `${{ github.event_name }}`
            - Download the APK below, install it on your device and allow "install from unknown sources".

            A stable link is always available at:
            `https://github.com/dan-seng/balance-tracker/releases/latest/download/Hisab.apk`
          files: '*.apk'
          make_latest: true
          fail_on_unmatched_files: true